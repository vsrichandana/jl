services:
  - type: web
    name: schedule-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # Set this manually in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PYTHON_VERSION
        value: "3.11.0"